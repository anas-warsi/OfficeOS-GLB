<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeOS - Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
  
    <style>
         *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
 }
 body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card{

            height: 400px;
            width: 400px;
            border : 2px solid white;
            border-radius: 20px;
            box-shadow: 3px 3px 5px #6d69cd;
            
        }
        .login-header{
            width: 100%;
            height: 50px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            margin-top:20px;
           
        }
        .login-body{
            width: 100%;
            display:flex;
            flex-direction:column;
            margin-top:45px;
            padding: 15px;
        }

        .label{
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: white;

        }
        .form-input{
            width: 100%;
            height: 40px;
            padding: 5px;
            border: none;
            border-radius: 5px;
        }
        .form-box{
            margin-bottom: 25px;
        }
        .btn{
            width: 100%;
            padding: 10px 3px;
            font-weight: bold;
            font-size: 20px;
            border:none;
            border-radius: 5px;
            background-color: #423cfc;
            color: white;
        }
    </style>
    
   
</head>
<body>
   <div class="login-card">
    <div class="login-header">
        <h2>Office OS Login</h2>
    </div>
    <div class="login-body">
        <form action="" method="post">
        <div class="form-box">
            <label class="label" for="Email">Username / Email</label>
            <input type="text"
                   name="email"
                   placeholder="Enter Your Username"
                   class="form-input">
        </div>
        <div class="form-box">
            <label class="label" for="Email">Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter Your Password"
                   class="form-input">
        </div>

        <button class="btn" type="submit">Login</button>
        </form>
    </div>
   </div>
</body>



</html>
